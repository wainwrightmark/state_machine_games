[workspace]
members = ["state_machine_games", "examples/*"]
default-members = ["state_machine_games"]
resolver = "3"


[workspace.dependencies]
console_error_panic_hook = "0.1.7"
wasm-logger = "0.2.0"
leptos = { version = "0.8", features = ["csr"] }
glam = { version = "0.32" }

leptos-use = { version = "0.18" }
rand = { version = "0.9.2" }
rand_core = {version = "0.9.2"}
static_assertions = "1.1.0"
impl-trait-for-tuples = "0.2.3"
strum = { version = "0.28", features = ["derive"] }
const_sized_bit_set = { version = "0.5.0", features = ["std"] }
bevy_color = { version = "0.18" }
insta = "1.47"
