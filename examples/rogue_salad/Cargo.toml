[package]
name = "rogue_salad"
version = "0.1.0"
publish = false
edition = "2024"


[dependencies]
state_machine_games = { path = "../../state_machine_games", features = [
    "leptos",
    "bevy_color",
] }
geometrid = "0.10"
wasm-logger = "0.2.0"
console_error_panic_hook = "0.1.7"
rand = "0.9"
web-time = "1.1"
serde = { version = "1", features = ["derive", "rc"] }
strum = { version = "0.27", features = ["derive"] }
itertools = { version = "0.14" }
ws_core = { path = 'C:\Source\rust\word_salad\ws_core' }
anyhow = "1"
bevy_color = "0.17"
base64 = "0.22"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
leptos-use = { version = "0.17" }
const_sized_bit_set = "0.5.0"
web-sys = {version = "0.3", features = ["SvgElement"]}
function_name = "0.3.0"
indexed_db_futures = {version = "0.6.4", features = ["serde"]}
serde_json = "1.0.149"
async-channel = "2.5"
glam = "0.31.0"
rand_core = "0.10.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
insta = "1.43"
test-case = "3"
