[package]
name = "state_machine_games"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
wasm-logger = "0.2.0"
leptos = { version = "0.8", features = ["csr"], optional = true}
glam = {version = "0.30.9"}

leptos-use = {version = "0.17", optional = true}
rand = {version = "0.9.2"}
static_assertions = "1.1.0"
impl-trait-for-tuples = "0.2.3"
strum = { version = "0.27.2", features = ["derive"] }
const_sized_bit_set = {version = "0.5.0", features = ["std"]}
bevy_color = {version = "0.17", optional = true}

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }


[dev-dependencies]
insta = "1.45"

[features]
leptos = ["dep:leptos", "dep:leptos-use"]
bevy_color= ["dep:bevy_color"]
